version: "v0.4"

project:
  name: "Rigidity of harmonic functions on the supercritical percolation cluster"
  description: >-
    A Lean 4 formalization of the paper "Rigidity of harmonic functions on the supercritical
    percolation cluster" by Bou-Rabee, Cooperman and Dario, in a corrected draft of the arXiv v2
    source: on the infinite cluster of supercritical Bernoulli bond percolation on Z^d, Lipschitz
    harmonic functions are constant (Theorem 1.1), integer-valued harmonic functions of linear growth
    are constant (Theorem 1.2), in two dimensions a function with integer Laplacian of finite support
    that decays faster than |x|^-1 has finite support (Theorem 1.3), and the sandpile Markov chain on
    the largest cluster of a box of radius n mixes in time of order n^d log n (Theorem 6.5). All 43
    numbered results that the paper proves are proved in Lean, from twelve results of the literature
    that enter as explicit hypotheses; ten of these inputs are also proved in Lean, the other two
    (the quantitative corrector input and the quantitative Green estimate of Dario and Gu) remain
    hypotheses in general dimension; their dimension-two forms are proved, so Theorem 1.3
    (fast_decay_holds) and Theorem 6.5 are proved with no literature hypothesis, and so is Theorem 1.2
    (Rigidity.Assembly.Unconditional.integer_valued_linear_growth), the qualitative corrector input
    being proved in every dimension. For d >= 3 the
    quantitative corrector input rests on the single hypothesis DarioStepTwoWeightThree (Lemma 3.5
    of Dario in corrected form and the Step 1 sum being proved), and the quantitative Green
    estimate on that hypothesis alone (FluxFlipWeightBoundD is proved,
    Rigidity.Green.GeneralFlux.fluxFlipWeightBoundD_holds). The other five numbered results are quoted from the
    literature; one of them, Lemma 2.13, is not an input and is used by no Lean proof, and its
    special case for unions of lattice squares is proved. Theorems 1.1, 1.2, 1.3 and 6.5 are
    independently checked by the comparator pairs under RigidityAudit/, and so are Theorems 6.5, 1.2
    and 1.3 with the regime as their only hypothesis.
  authors:
    - "Ahmed Bou-Rabee"
  responsible_maintainers:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.AP"]
  msc2020: ["60K35", "82B43"]

sources:
  - title: "Rigidity of harmonic functions on the supercritical percolation cluster"
    authors:
      - "Ahmed Bou-Rabee"
      - "William Cooperman"
      - "Paul Dario"
    type: "paper"
    relationship: "formalizes"
    location: "paper/"
    note: >-
      Transactions of the American Mathematical Society 378(6) (2025), 3823-3896,
      doi:10.1090/tran/9264; arXiv:2303.04736. The statements follow the corrected draft
      paper/percolation-harmonic-corrected.tex, whose corrections are marked in the source and listed
      in README.md; the unmodified arXiv v2 source is paper/percolation-harmonic.tex.
    license: "authors' copyright; included with the authors' permission"
    author_endorsement: "participated"
  - title: "Elliptic regularity and quantitative homogenization on percolation clusters"
    authors: ["Scott Armstrong", "Paul Dario"]
    type: "paper"
    relationship: "assumes"
    note: "Comm. Pure Appl. Math. 71 (2018); arXiv:1609.09431v2. Theorem 2(iii) at k = 0 and k = 1, with (1.16), enters as literature inputs (see README)."
  - title: "Quantitative homogenization of the parabolic and elliptic Green's functions on percolation clusters"
    authors: ["Paul Dario", "Chenlin Gu"]
    type: "paper"
    relationship: "assumes"
    note: "Ann. Probab. 49 (2021); arXiv:1909.10439v4. Theorem 2 with (1.10)-(1.11), the existence and uniqueness of the Green's function around (1.8) (stated there without proof) and Proposition 2.12 enter as literature inputs. Proposition A.1, also stated as a literature input, is proved, and so is the existence and uniqueness of the Green's function, in every dimension (next two entries)."
  - title: "Quantitative homogenization of the parabolic and elliptic Green's functions on percolation clusters"
    authors: ["Paul Dario", "Chenlin Gu"]
    type: "paper"
    location: "Appendix A, Proposition A.1"
    relationship: "independently-proves"
    note: "Proposition A.1, the concentration of the density of the infinite cluster in triadic cubes (Rigidity.External.ClusterDensityConcentrationInput), is proved in every dimension (Rigidity.Proofs.S2.cluster_density_concentration), with an iteration of the Efron-Stein variance inequality over the moments in place of the exponential Efron-Stein inequality of the source and, for d >= 3, with the exponential decay of the radius of finite clusters in place of the volume tail of Kesten and Zhang, at the exponent 1/(floor((3d+3)/2)+1) >= 2(d-1)/(3d^2+2d-1) for d >= 3 and 1/7 >= 2/15 for d = 2 (README, Proposition 2.3 and the density concentration for d = 2, and Density concentration in every dimension)."
  - title: "Quantitative homogenization of the parabolic and elliptic Green's functions on percolation clusters"
    authors: ["Paul Dario", "Chenlin Gu"]
    type: "paper"
    location: "p. 4, around (1.8), and p. 58"
    relationship: "independently-proves"
    note: "The existence and uniqueness of the Green's function of the infinite cluster (LatticeProb.External.SupercriticalBondGreenColumnExistence), stated there without proof, is proved for d >= 3 (Rigidity.Green.greenColumnExistence_of_three_le) by the route of Mathieu and Remy, isoperimetry, Faber-Krahn, Nash and on-diagonal decay, with an isoperimetric inequality of the cluster of polynomial loss R^(-1/(100d)) from one coarse graining by good subcubes, in place of the Gaussian bounds of Barlow; with the planar case, Rigidity.Green.supercriticalBondGreenColumnExistence_of_orderZeroTwo derives the input from the planar order-zero estimate, and the planar case being proved, the input is proved in every dimension (Rigidity.Green.supercriticalBondGreenColumnExistence_holds). The same route gives heat kernel bounds for d >= 2 and the decay |x-y|^(2-d+1/50+delta) of the Green columns for d >= 3, weaker by polynomial factors than those that DG derive from Barlow's Gaussian bounds (README, Green columns for d >= 3)."
  - title: "Percolation"
    authors: ["Geoffrey Grimmett"]
    type: "book"
    relationship: "assumes"
    note: "Second edition, Springer, 1999. (1.8), (1.10), (1.11) and Theorem 8.1 enter as a literature input, with Burton and Keane, Theorem 2. Theorem (8.21), the exponential decay of the radius of finite clusters, is proved for d >= 3 by a route through crossing estimates (README, Well-connected cubes and finite clusters for d >= 3); it replaces the tail of Kesten and Zhang in the proof of the density concentration for d >= 3."
  - title: "Density and uniqueness in percolation"
    authors: ["Robert M. Burton", "Michael Keane"]
    type: "paper"
    relationship: "assumes"
    note: "Comm. Math. Phys. 121 (1989), 501-505. Theorem 2 (uniqueness of the infinite cluster) enters as a literature input."
  - title: "Surface order large deviations for Ising, Potts and percolation models"
    authors: ["Agoston Pisztora"]
    type: "paper"
    relationship: "assumes"
    note: "Probab. Theory Related Fields 104 (1996). The box estimate of Theorems 1.2 and 3.1, as recalled by Penrose and Pisztora (Adv. Appl. Probab. 28 (1996), p. 35), gives Proposition 2.3 of the paper for d >= 3 by a union bound. For d >= 3 Proposition 2.3 is proved, with this estimate replaced by crossing estimates from slab connectivity (README, Well-connected cubes and finite clusters for d >= 3); with its case d = 2, Proposition 2.3 is proved in every dimension (Rigidity.Percolation.wellConnected_input)."
  - title: "Surface order large deviations for 2D FK-percolation and Potts models"
    authors: ["Olivier Couronné", "Reda Jürg Messikh"]
    type: "paper"
    relationship: "assumes"
    note: "Stochastic Process. Appl. 113 (2004), 81-99; arXiv:math/0303117v1. Theorem 5, (7), gives Proposition 2.3 of the paper for d = 2 by a union bound. The Lean proof of the case d = 2 uses Kesten's rectangle-crossing estimate instead (README, Proposition 2.3 and the density concentration for d = 2)."
  - title: "Percolation Theory for Mathematicians"
    authors: ["Harry Kesten"]
    type: "book"
    relationship: "assumes"
    note: "Birkhäuser, 1982. Theorem 11.1, equation (11.4), enters as a literature input."
  - title: "Real and Complex Analysis"
    authors: ["Walter Rudin"]
    type: "book"
    relationship: "assumes"
    note: "Chapter 14, as cited in the paper: the Jordan curve theorem on the sphere enters as a literature input."
  - title: "Algebraic Topology"
    authors: ["Allen Hatcher"]
    type: "book"
    relationship: "assumes"
    note: "Cambridge University Press, 2002. Proposition 2B.1 and the remark after it (p. 169): the Jordan curve theorem on the sphere, a literature input."
  - title: "Worst-case to average-case reductions based on Gaussian measures"
    authors: ["Daniele Micciancio", "Oded Regev"]
    type: "paper"
    relationship: "assumes"
    note: "SIAM J. Comput. 37 (2007). Lemma 3.3 enters as a literature input."
  - title: "Percolation on graphs of polynomial growth"
    authors: ["Daniel Contreras"]
    type: "dissertation"
    id: "doi:10.3929/ethz-b-000585148"
    location: "Chapter 2: Theorem 2.1.2, Lemmas 2.3.2-2.3.5 and 2.4.1"
    relationship: "adapts"
    note: "ETH Zürich, 2022. Its bootstrap proof of the theorem of Grimmett and Marstrand is formalized for bond percolation in d >= 3, with Lemma 2.4.1 proved in a form with zones, and is followed by a static renormalization in slabs (see README, Slab connectivity above the critical point)."
  - title: "The supercritical phase of percolation is well behaved"
    authors: ["Geoffrey R. Grimmett", "John M. Marstrand"]
    type: "paper"
    relationship: "independently-proves"
    note: "Proc. R. Soc. Lond. A 430 (1990), 439-457. The theorem is proved for bond percolation in d >= 3, in the finite-volume form of a uniform two-point bound in the slabs of cubes, by the route of Contreras's dissertation."
  - title: "Isoperimetry and heat kernel decay on percolation clusters"
    authors: ["Pierre Mathieu", "Elisabeth Remy"]
    type: "paper"
    relationship: "adapts"
    note: "Ann. Probab. 32 (2004). Its route from the isoperimetric inequality of the cluster to the decay of the heat kernel is followed, with a polynomial loss R^(-1/(100d)) in the isoperimetric constant and the decay exponent d/2 - 1/100 in place of d/2, for the Green columns in d >= 3 (README, Green columns for d >= 3)."
  - title: "Random walks on supercritical percolation clusters"
    authors: ["Martin T. Barlow"]
    type: "paper"
    location: "Sections 3 and 6: Propositions 3.1, 3.4, 3.7 and 6.1, Theorem 3.8, Theorem 1 (upper bound)"
    relationship: "adapts"
    note: "Ann. Probab. 32 (2004), 3024-3084. The upper bound (0.4) of Theorem 1 with the tail (0.5), Theorem 4 of Dario and Gu (Rigidity.Green.BarlowGaussianUpperBoundTwo), is proved in dimension two along Sections 3 and 6 (Rigidity.Barlow.barlowGaussianUpperBoundTwo_of_veryGood) from the Carne-Varopoulos bound and the very good balls of Theorem 2.18(c) and Lemma 2.19 for Euclidean balls (Rigidity.Barlow.ClusterVeryGoodBallsTwo). These are proved in every dimension (Rigidity.WeakPoincare.clusterVeryGoodBalls_holds; Rigidity.Barlow.clusterVeryGoodBallsTwo_holds in dimension two), so the bound holds with no hypothesis (Rigidity.Barlow.barlowGaussianUpperBoundTwo_holds), and Theorem 1.3 follows without it (Rigidity.Assembly.WithProvedBarlow.fast_decay_of_sections, fast_decay_of_flux_gradient) (README, The Gaussian upper bound of Barlow in dimension two). The bound is proved in every dimension d >= 2 with the prefactor t^(-d/2) (Rigidity.BarlowLattice.barlowGaussianUpperBound_holds : Rigidity.Green.BarlowGaussianUpperBound d), for the heat kernel Rigidity.Green.bondHeat of the variable speed walk on Z^d, from the Carne-Varopoulos bound on Z^d (Rigidity.Green.carneVaropoulos_holds) and Rigidity.WeakPoincare.clusterVeryGoodBalls_holds (README, The heat kernel and the Gaussian upper bound of Barlow in every dimension)."

