name: CI

permissions:
  contents: read

# Runs on GitHub-hosted runners (`ubuntu-24.04`: 4 vCPU, 16 GB RAM, 6 h per job). No
# `pull_request` trigger: a fork's pull request would run with this repository's Actions cache in
# scope, and the cached `.lake` trees are the artifacts that the comparator workflow trusts.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'paper/**'
      - 'formalization.yaml'
      - 'CITATION.cff'
  workflow_dispatch:

# A run on main is never cancelled by a later push: it finishes and banks its build artifacts,
# and GitHub keeps only the newest pending run of the group, which then builds the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Mathlib's oleans come from its public cache. Lake builds Lattice-Probability and
  # Percolation-Cluster-Homogenization at the commits pinned in `lake-manifest.json`, then the
  # library. Two caches hold the build directories: one for the two dependencies, keyed by the
  # toolchain and the manifest only, and one for all three build directories, keyed by the commit.
  build:
    name: Build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # elan retries a failed toolchain download only once; this step retries the pinned release
      # asset with backoff and checks its SHA-256, so that the next step finds the toolchain
      # already installed.
      - name: Prefetch the pinned Lean toolchain with retries
        run: python3 scripts/prefetch_toolchain.py

      # Installs the toolchain named in `lean-toolchain`. The action's own cache of `.lake` (about
      # 2.5 GB per commit, mostly Mathlib oleans that its public cache already serves) is off, so
      # that it does not evict the build caches below from the repository's cache quota.
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: false
          use-github-cache: false

      # Fetches every package in `lake-manifest.json` and downloads the Mathlib oleans. A download
      # from the Mathlib cache can fail part-way; `lake exe cache get` keeps the files it already
      # has, so each retry fetches only the missing ones.
      - name: Fetch the Mathlib cache with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if lake exe cache get; then exit 0; fi
            echo "Fetching the Mathlib cache failed (attempt $attempt of 5)."
            sleep $((attempt * 30))
          done
          exit 1

      # Restore and save are split so that a save runs even when a later step fails: a failed or
      # timed-out build still banks its completed modules. No save runs on a cancelled run, whose
      # Lake process may still be writing the build directories. The restore key of the commit
      # cache has no sha, so it matches the most recent entry with the same toolchain and
      # manifest, which makes an ordinary push incremental; the dependency cache is restored
      # after it, so that its complete dependency builds take precedence.
      - name: Restore build artifacts
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .lake/build
            .lake/packages/lattice-probability/.lake/build
            .lake/packages/percolation-cluster-homogenization/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Restore dependency build artifacts
        id: deps-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .lake/packages/lattice-probability/.lake/build
            .lake/packages/percolation-cluster-homogenization/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # The root module of Percolation-Cluster-Homogenization imports all of its results (the
      # axiom report prints some that no module of this library imports) and, through them, the
      # Lattice-Probability modules they use.
      - name: Build the dependencies
        timeout-minutes: 240
        shell: bash
        run: |
          set -o pipefail
          lake build PercolationClusterHomogenization 2>&1 | tee dependency-build.log

      - name: Save dependency build artifacts
        if: steps.deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .lake/packages/lattice-probability/.lake/build
            .lake/packages/percolation-cluster-homogenization/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # The library is compiled with `warningAsError`, so a warning fails the build.
      - name: Build the library and enforce zero warnings
        timeout-minutes: 240
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee production-build.log
          lake build PercolationClusterHomogenization 2>&1 | tee -a production-build.log
          if grep -iE '(^|[[:space:]])warning:|declaration uses .sorry|sorryAx' production-build.log; then
            echo "The production build must have zero warnings and no incomplete proofs."
            exit 1
          fi

      # `RigidityAudit/Axioms.lean` prints the axioms of every numbered result of the paper: the
      # theorem of each proved result and the proposition stating each cited one. The check fails
      # on any axiom other than propext, Classical.choice and Quot.sound, on `sorryAx`, and on a
      # missing, unexpected or repeated report.
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean RigidityAudit/Axioms.lean 2>&1 | tee axioms-audit.log
          python3 scripts/check_axioms.py axioms-audit.log

      # The Mathlib-only comparator surface: each challenge elaborates with its one intentional
      # `sorry`, and each solution proves it from the library.
      - name: Build the comparator surface
        shell: bash
        run: |
          set -o pipefail
          lake build RigidityAudit 2>&1 | tee audit-build.log

      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-logs-${{ github.sha }}
          path: |
            dependency-build.log
            production-build.log
            axioms-audit.log
            audit-build.log
          if-no-files-found: warn

      - name: Save build artifacts
        if: ${{ !cancelled() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .lake/build
            .lake/packages/lattice-probability/.lake/build
            .lake/packages/percolation-cluster-homogenization/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
